name: menu_plat
description: "Gestión inteligente de restaurantes"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.8.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # State Management
  get: ^4.6.6

  # HTTP Client
  dio: ^5.4.0

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # Dependency Injection
  get_it: ^7.6.4

  # Functional Programming
  dartz: ^0.10.1

  # Equatable for value comparison
  equatable: ^2.0.5

  # JSON Serialization
  json_annotation: ^4.8.1

  # Internationalization
  intl: any

  # Network Info
  internet_connection_checker: ^1.0.0+1

  # Shared Preferences
  shared_preferences: ^2.2.2

  # Local Database (offline-first cache + outbox queue)
  hive_flutter: ^1.1.0

  # Icons
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.6.0

  # Image Handling
  cached_network_image: ^3.3.0

  # Shimmer Loading
  shimmer: ^3.0.0

  # Smooth Page Indicator
  smooth_page_indicator: ^1.1.0

  # Logger
  logger: ^2.0.2+1

  # UUID Generator
  uuid: ^4.5.1

  # Impresión térmica POS (80mm / 58mm) — abre dialog nativo del SO
  # con selector de impresora. `pdf` para futuros generadores locales
  # de PDF (preview de comanda antes de enviar al backend, etc.).
  printing: ^5.13.0
  pdf: ^3.11.0

  # ESC/POS para impresoras térmicas POS de red.
  # Las térmicas (Epson TM, Bixolon, Xprinter, etc.) NO entienden
  # PDF — solo entienden ESC/POS (protocolo binario de comandos).
  # Mandarles PDF directo hace que impriman caracteres random y
  # desperdicien rollo de papel.
  esc_pos_utils_plus: ^2.0.4

  # Decodificar/redimensionar el logo del negocio para rasterizarlo en
  # el recibo térmico (gen.image espera un Image del paquete `image`).
  # Ya venía transitivo via esc_pos_utils_plus; lo declaramos directo.
  image: ^4.8.0

  # Escaneo de códigos de barras / QR con la cámara (alta de productos:
  # campo SKU; y búsqueda de productos al vender). Requiere permiso de
  # cámara en Android/iOS.
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0

  # Selección de imágenes (galería/cámara) para la foto del producto.
  # Se sube a Cloudinary (unsigned) y se guarda la URL en image_url.
  image_picker: ^1.1.2

  # Abrir URL externa para fallback (ej. abrir PDF en navegador si la
  # plataforma no soporta `printing` directamente).
  url_launcher: ^6.3.0

  # Vibración fuerte personalizada (patrón tipo modo silencio).
  # HapticFeedback solo da pulsos cortos; este paquete permite patrones
  # largos y repetidos en Android. En iOS hace vibración estándar.
  vibration: ^3.1.3

  # Reproducción de sonido custom desde assets (qr_alert.mp3).
  # El archivo lo coloca el usuario en assets/sounds/qr_alert.mp3.
  audioplayers: ^6.1.0

  # Push notifications vía Firebase Cloud Messaging (FCM).
  # Permite recibir alertas de pedidos QR cuando el celular está bloqueado
  # o la app está en segundo plano. Requiere google-services.json (Android)
  # y GoogleService-Info.plist (iOS) del proyecto Firebase.
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5

  # Muestra la notificación como heads-up cuando la app está en primer plano.
  # En background/locked la notificación la entrega FCM directamente el SO.
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/sounds/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
