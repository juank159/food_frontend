server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Todas las rutas de Flutter van al index.html (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sin cache para archivos JS/HTML principales — Flutter maneja su propio versionado
    location ~* \.(js|html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Cache para assets estáticos con hash (imágenes, fuentes, wasm)
    location ~* \.(wasm|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Seguridad básica
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
